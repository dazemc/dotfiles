general {
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({action = "on"})'
}

listener {
    timeout = 150
    on-timeout = ~/.config/hypr/scripts/hypridle-dim
    on-resume = brightnessctl -r

    condition_cmd = ~/.config/hypr/scripts/audio-idle
    condition_retry = 30
}

listener {
    timeout = 330
    on-timeout = ~/.config/hypr/scripts/hypridle-dpms-off
    on-resume = hyprctl dispatch 'hl.dsp.dpms({action = "on"})'

    condition_cmd = ~/.config/hypr/scripts/audio-idle
    condition_retry = 30
}

listener {
    timeout = 1800
    on-timeout = ~/.config/hypr/scripts/hypridle-suspend

    condition_cmd = ~/.config/hypr/scripts/audio-idle
    condition_retry = 30
}
